server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: root
    password: ${HMDP_DB_PASSWORD}
  redis:
    host: 192.168.150.101
    port: 6379
    password: ${HMDP_REDIS_PASSWORD}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
app:
  ai:
    access-token: ${AI_ACCESS_TOKEN:}
    chat-base-url: ${AI_CHAT_BASE_URL:}
    chat-api-key: ${AI_CHAT_API_KEY:}
    chat-model: ${AI_CHAT_MODEL:}
logging:
  level:
    com.hmdp: debug